# Every publish of the site, newest first, for docs/changelog.md.
#
# publish: the homelab-docs pull request number, the commit for the four early
#   direct pushes, or `next` for the publish being prepared. The live build
#   fills in `next` from its own commit; tools/changelog.py later turns it into
#   the number, so the next publish can be added above it.
# changes: one line each, labelled added doc, changed doc, removed doc,
#   added feature, changed feature, removed feature, or fix. A feature or fix is
#   a change to the homelab itself, which the published pages describe. Links
#   are relative to docs/.
#
# Times, links, the kind column and the pace section are all generated.

- publish: next
  changes:
    - changed feature: "each process in [glances](monitoring/glances.md) shows its full command line with secret-looking values masked, tagged with the container it runs in"
    - added feature: "a loopback-only [docker proxy](monitoring/glances.md#the-docker-proxy-on-syn02-and-pi-zwave01) on syn02 and pi-zwave01, so glances can name containers"
    - fix: "chrony on pi-zwave01 starts at boot again. the [gps time](raspberry-pi/gps-time.md) override no longer orders it after gpsd, which made a loop that systemd broke by dropping chrony"

- publish: 41
  changes:
    - changed feature: "[glances](monitoring/glances.md) lists each host's processes, read from the host's `/proc`, as nobody with no capabilities"
    - changed feature: "truenas1's app configs are snapshotted [hourly for three days and daily for two weeks](truenas/storage.md#3-snapshot-the-config), to stay under TrueNAS's 10,000-snapshot warning"

- publish: 40
  changes:
    - added feature: "a third UPS, in the [smc closet](ups/smc.md), for the closet's network gear and syn02. a NUT server in a container on truenas1 reads it, for PeaNUT and prometheus"
    - added feature: "[gatus](monitoring/gatus.md#checking-the-ups-cards-and-nut) checks each UPS card, each NUT server, and whether each server's data is fresh, judged by what prometheus has from the NUT exporter"
    - changed feature: "pve2 and pve3's NUT servers [listen on the lan](ups/proxmox.md#nut-on-each-node) too, for the exporter"
    - added feature: "the UPS cards send their logs to [victorialogs](monitoring/victorialogs.md#pointing-the-ups-cards-at-it)"
    - fix: "the docker hosts answer arp for their own address on one interface only, so the gateway no longer sees it flip between `eth0` and the [macvlan shim](apps/adguard.md#the-shim-answers-arp-only-for-its-own-path) and raise an ip conflict"
    - removed feature: "nginx proxy manager is retired: its stack, its name on [traefik](apps/traefik.md), its gatus checks and its homepage tiles are gone"
    - changed doc: "[nginx proxy manager](apps/retired/nginx-proxy-manager.md) moved to no longer used, without its stack file"


site_name: scyto's homelab docs
site_description: Proxmox cluster and Docker Swarm build notes, soup to nutz.
site_url: https://scyto.github.io/homelab-docs/
repo_url: https://github.com/scyto/homelab-docs
repo_name: scyto/homelab-docs
edit_uri: edit/main/docs/
copyright: These are my own re-install notes, don't take any of it on blind faith.

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    # previous and next links under every page, in nav order
    - navigation.footer
    - toc.follow
    # the page's contents in the left sidebar, under the section nav, on every
    # page -- not a second column on the right
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# docs/changelog.md is built from changelog/ by this hook, which also fills in
# the newest publish's time on the live build.
hooks:
  - hooks/changelog.py

plugins:
  - search
  # Every page moved in the 2026-09-21 restructure keeps its old URL. The
  # stack pages started life as gists and are linked from outside.
  - redirects:
      redirect_maps:
        docker-swarm/configure-swarm.md: docker/swarm/configure-swarm.md
        docker-swarm/debian-vm-install.md: docker/swarm/debian-vm-install.md
        docker-swarm/gitops-with-portainer.md: docker/gitops-with-portainer.md
        docker-swarm/glusterfs-docker-plugin.md: docker/deprecated/glusterfs-docker-plugin.md
        docker-swarm/glusterfs-install.md: docker/deprecated/glusterfs-install.md
        docker-swarm/image-updates-renovate.md: docker/image-updates-renovate.md
        docker-swarm/index.md: docker/index.md
        docker-swarm/install-docker.md: docker/swarm/install-docker.md
        docker-swarm/keepalived.md: docker/swarm/keepalived.md
        docker-swarm/portainer.md: docker/portainer.md
        docker-swarm/stacks/acme-asrock-bmc.md: apps/acme-asrock-bmc.md
        docker-swarm/stacks/acme-synology.md: apps/acme-synology.md
        docker-swarm/stacks/adguard.md: apps/adguard.md
        docker-swarm/stacks/auto-label-nodes.md: apps/auto-label-nodes.md
        docker-swarm/stacks/bentopdf.md: apps/bentopdf.md
        docker-swarm/stacks/cloudflare-ddns.md: apps/cloudflare-ddns.md
        docker-swarm/stacks/infinitude.md: apps/infinitude.md
        docker-swarm/stacks/mosquitto-mqtt.md: apps/mosquitto-mqtt.md
        docker-swarm/stacks/nginx-proxy-manager.md: apps/nginx-proxy-manager.md
        docker-swarm/stacks/oauth2-proxy.md: apps/oauth2-proxy.md
        docker-swarm/stacks/omni-tools.md: apps/omni-tools.md
        docker-swarm/stacks/portainer-agent.md: apps/retired/portainer-agent.md
        docker-swarm/stacks/portception.md: apps/retired/portception.md
        docker-swarm/stacks/shepherd.md: apps/retired/shepherd.md
        docker-swarm/stacks/traefik.md: apps/retired/traefik.md
        docker-swarm/stacks/unifi-poller.md: apps/index.md
        docker-swarm/stacks/watchtower.md: apps/retired/watchtower.md
        docker-swarm/troubleshooting.md: docker/troubleshooting.md
        truenas/frigate.md: apps/frigate.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  # the generated file blocks: one details block per published file, which
  # takes open: and type:, and an html section that keeps a long file out of
  # the search index (see the generator's render())
  - pymdownx.blocks.details
  - pymdownx.blocks.html
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid blocks render as diagrams; Material loads mermaid itself
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # the published stack and config files, generated from the private stacks/
  # under the redaction rules: includes/blocks/ holds one annotated block per
  # file for the pages to include, docs/files/ the clean copy for download.
  # check_paths fails the build when a generated block is missing
  - pymdownx.snippets:
      base_path: [includes]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  # Required for :material-*: / :octicons-*: icon shortcodes. Without it they
  # render as literal text, e.g. ":material-docker:" on the home page cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# a link to a heading that no longer exists is a warning, so --strict fails
# on it. without this, mkdocs checks that the page exists and not the anchor
validation:
  links:
    anchors: warn

# mkdocs serve rebuilds when the generated blocks change, not only docs/
watch:
  - includes

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/scyto
      name: scyto on GitHub
    - icon: material/forum
      link: https://github.com/scyto/homelab-docs/discussions
      name: Ask a question in Discussions


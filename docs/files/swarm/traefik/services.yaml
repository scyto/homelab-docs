domain: mydomain.com

vip: 192.168.1.45

oauth:
  host: auth.mydomain.com
  upstream: http://192.168.1.45:4180

other_endpoints:
  - name: Frigate API
    address: "192.168.1.86:5000"
    auth: "none: the whole API, config and camera control included"
    mfa: "none"
  - name: MQTT (mosquitto)
    address: "192.168.1.45:1883"
    auth: "none: allow_anonymous true, so anyone can publish, Zigbee2MQTT's command topics included"
    mfa: "none"
  - name: Docker API proxy (truenas1)
    address: "192.168.1.86:2375"
    auth: "none: read-only Docker API"
    mfa: "none"
  - name: Ollama
    address: "192.168.1.86:30068"
    auth: "none"
    mfa: "none"
  - name: FlareSolverr
    address: "192.168.1.86:8191"
    auth: "none"
    mfa: "none"
  - name: Portainer agent (swarm nodes)
    address: "192.168.1.41, .42, .43:9001"
    auth: "none: no AGENT_SECRET, so any Portainer that reaches it can adopt the node (owner accepted, 2026-09-22)"
    mfa: "none"
  - name: Portainer agent (truenas1, pi-zwave01)
    address: "192.168.1.86:9001, 192.168.1.96:9001"
    auth: "unknown: not defined in this repo, so whether AGENT_SECRET is set is unchecked"
    mfa: "none"
  - name: Dozzle agents
    address: "192.168.1.41, .42, .43, .31, .86, .96:7007"
    auth: "mutual TLS with the shared dozzle agent certificate"
    mfa: "none"
  - name: oauth2-proxy
    address: "192.168.1.45:4180"
    auth: "it is the Entra sign-in; nothing is behind it but a 202"
    mfa: "Entra"

npm_passthrough:
  to: 192.168.1.45:1443
  hosts:
    - wordpress.mydomain.com
    - wpadmin.mydomain.com

services:

  traefik:
    upstream: api@internal
    internal: oauth
    native:
      auth: "none: its read-only API has no login"
      mfa: "none"
      direct: "no port of its own; the API is also on :8080, for traefik-api only"

  apprise:
    upstream: http://192.168.1.45:8050
    internal: oauth
    native:
      auth: "none"
      mfa: "none"

  bentopdf:
    upstream: http://192.168.1.45:8091
    internal: open
    native:
      auth: "none"
      mfa: "none"

  blog:
    upstream: http://192.168.1.45:8180
    internal: open
    external: public
    native:
      auth: "WordPress password login (wp-login.php)"
      mfa: "unknown: check for a 2FA plugin"

  apex:
    host: mydomain.com
    upstream: http://192.168.1.45:8180
    internal: open
    external: public
    external_redirect: https://www.mydomain.com
    native:
      auth: "WordPress password login, at a custom address (wp-login.php answers 404); the network admin is here"
      mfa: "unknown: check for a 2FA plugin"

  mydomain1:
    host: mydomain1.com
    upstream: http://192.168.1.45:8180
    external: public
    native:
      auth: "WordPress password login, at a custom address (wp-login.php answers 404)"
      mfa: "unknown: check for a 2FA plugin"

  dozzle:
    upstream: http://192.168.1.41:8888
    internal: oauth
    native:
      auth: "none"
      mfa: "none"

  gatus:
    upstream: http://192.168.1.45:8085
    internal: open
    native:
      auth: "none"
      mfa: "none"

  homepage:
    upstream: http://192.168.1.45:3000
    internal: open
    external: oauth
    native:
      auth: "none"
      mfa: "none"

  ha:
    upstream: https://192.168.1.63:443
    tls_name: homeassistant.mydomain.com
    external: own-mfa
    mfa: Home Assistant's authenticator-app (TOTP) module, which every user must have turned on
    native:
      auth: "password"
      mfa: "authenticator-app module: not yet confirmed for every user"
      direct: "192.168.1.63:443 (homeassistant.mydomain.com)"

  infinitude:
    upstream: http://192.168.1.45:4000
    internal: open
    native:
      auth: "none"
      mfa: "none"

  npm:
    upstream: http://192.168.1.45:181
    internal: open
    native:
      auth: "password (NPM's admin)"
      mfa: "none"

  omni-tools:
    upstream: http://192.168.1.45:8090
    internal: open
    native:
      auth: "none"
      mfa: "none"

  portainer:
    upstream: http://192.168.1.45:9000
    internal: open
    external: own-mfa
    mfa: Portainer's own OAuth sign-in to Entra, where Conditional Access requires MFA; its password login and API keys need the proxy's Entra sign-in outside
    external_oauth_paths:
      - /api/auth
    external_oauth_headers:
      - X-API-Key
    native:
      auth: "native oauth (Entra); the initial admin's password (always on); API keys"
      mfa: "Entra; the password and API keys have none"
      direct: "192.168.1.45:9000, :9443"

  unifiapibrowser:

services:
  dozzle:
    image: amir20/dozzle:v11.1.0@sha256:7c4fb7f8124f5dea15ade881535cc19cc9a03e66639fd28154ff43a93b78944b
    environment:
      - TZ=America/Los_Angeles
      - DOZZLE_REMOTE_AGENT=192.168.1.41:7007|Docker01|Swarm,192.168.1.42:7007|Docker02|Swarm,192.168.1.43:7007|docker03|Swarm,192.168.1.86:7007|truenas1|TrueNAS,192.168.1.31:7007|syn02|Other,192.168.1.96:7007|pi-zwave01|Other
      - DOZZLE_CERT=/run/secrets/dozzle_agent_cert_v1
      - DOZZLE_KEY=/run/secrets/dozzle_agent_key_v1
    volumes:
      - type: bind
        source: /usr/share/zoneinfo
        target: /usr/share/zoneinfo
        read_only: true
      - data:/data
    secrets:
      - dozzle_agent_cert_v1
      - dozzle_agent_key_v1
    ports:
      - target: 8080
        published: 8888
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == Docker01
      labels:
        - homepage.group=Monitoring
        - homepage.name=Dozzle
        - homepage.icon=dozzle.png
        - homepage.href=http://192.168.1.41:8888
        - homepage.description=Container logs, all six hosts

  dozzle-agent:
    image: amir20/dozzle:v11.1.0@sha256:7c4fb7f8124f5dea15ade881535cc19cc9a03e66639fd28154ff43a93b78944b
    command: agent
    environment:
      - TZ=America/Los_Angeles
      - DOZZLE_CERT=/run/secrets/dozzle_agent_cert_v1
      - DOZZLE_KEY=/run/secrets/dozzle_agent_key_v1
    volumes:
      - type: bind
        source: /usr/share/zoneinfo
        target: /usr/share/zoneinfo
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - dozzle_agent_cert_v1
      - dozzle_agent_key_v1
    ports:
      - target: 7007
        published: 7007
        mode: host
    deploy:
      mode: global

secrets:
  dozzle_agent_cert_v1:
    external: true
  dozzle_agent_key_v1:
    external: true

volumes:
  data:

- Plumbing:
    - WordPress database:
        icon: mariadb.png
        description: MariaDB behind wordpress2025
        widget:
          type: customapi
          url: http://192.168.1.45:8085/api/v1/endpoints/plumbing_wordpress-database/statuses?page=1&pageSize=1
          refreshInterval: 60000
          mappings:
            - field: results.0.success
              label: Gatus
              format: text
              remap:
                - value: true
                  to: UP
                - value: false
                  to: DOWN
                - any: true
                  to: "?"
            - field: results.0.duration
              label: Response
              format: float
              scale: "1/1000000"
              suffix: ms
